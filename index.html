<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青空フラッシュ暗読</title>
<style>
  /* ── テーマ ── */
  :root[data-theme="dark"] {
    --bg: #1a1a1a; --fg: #f0f0f0; --accent: #ffcc44;
    --sub: #888; --card: #252525; --border: #333;
    --field-bg: #1a1a1a; --field-border: #444;
    --btn-bg: #333; --btn-border: #555; --btn-hover: #444;
    --back3-bg: #2a2a2a; --back3-hover: #383838;
    --progress-track: #2a2a2a;
  }
  :root[data-theme="light"] {
    --bg: #fafafa; --fg: #222; --accent: #d97706;
    --sub: #888; --card: #fff; --border: #e0e0e0;
    --field-bg: #fff; --field-border: #ccc;
    --btn-bg: #f0f0f0; --btn-border: #ccc; --btn-hover: #e5e5e5;
    --back3-bg: #f0f0f0; --back3-hover: #e0e0e0;
    --progress-track: #e0e0e0;
  }
  :root[data-theme="sepia"] {
    --bg: #f4ecd8; --fg: #5b4636; --accent: #b8860b;
    --sub: #9c8870; --card: #faf3e0; --border: #d8c9a8;
    --field-bg: #faf3e0; --field-border: #c5b794;
    --btn-bg: #e8dcc0; --btn-border: #c5b794; --btn-hover: #ddd0b0;
    --back3-bg: #e8dcc0; --back3-hover: #ddd0b0;
    --progress-track: #d8c9a8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Yu Gothic UI", "游ゴシック UI", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow-x: hidden;
    transition: background 0.2s, color 0.2s;
  }

  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ── 設定画面 ── */
  #settingsScreen { padding: 0 0 40px; overflow-y: auto; }
  .s-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
  .s-header h1 { font-size: 18px; font-weight: 500; color: var(--accent); }
  .s-section { padding: 20px 24px 0; }
  .s-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--sub); margin-bottom: 10px;
  }
  .s-card {
    background: var(--card); border-radius: 8px; padding: 16px;
    border: 1px solid var(--border);
  }
  select, input[type="text"], textarea {
    width: 100%; padding: 10px 12px;
    background: var(--field-bg); color: var(--fg);
    border: 1px solid var(--field-border); border-radius: 6px;
    font-size: 14px; font-family: inherit;
  }
  select { cursor: pointer; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
  .url-row { display: flex; gap: 8px; }
  .url-row input { flex: 1; }
  .btn-sm {
    padding: 10px 14px; background: var(--btn-bg); color: var(--fg);
    border: 1px solid var(--btn-border); border-radius: 6px;
    font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .btn-sm:hover { background: var(--btn-hover); }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row + .slider-row { margin-top: 14px; }
  .slider-row label { font-size: 13px; color: var(--sub); min-width: 78px; }
  .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .slider-val {
    font-size: 14px; color: var(--accent); font-weight: 600;
    min-width: 80px; text-align: right;
  }

  .pill-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill-btn {
    padding: 8px 16px; background: var(--field-bg); color: var(--sub);
    border: 1px solid var(--border); border-radius: 20px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .pill-btn:hover { color: var(--fg); }
  .pill-btn.active {
    background: var(--accent); color: var(--bg);
    border-color: var(--accent); font-weight: 600;
  }

  .start-btn {
    display: block; margin: 28px 24px 0;
    padding: 16px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; text-align: center; width: calc(100% - 48px);
  }
  .start-btn:hover { filter: brightness(1.1); }
  .start-btn.resume { filter: hue-rotate(180deg); }

  #settingsStatus {
    font-size: 12px; color: var(--sub); padding: 10px 24px 0; min-height: 20px;
  }

  .source-tabs {
    display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  .source-tab {
    flex: 1; padding: 10px; background: transparent; border: none; color: var(--sub);
    font-size: 13px; cursor: pointer; font-family: inherit;
    border-bottom: 2px solid transparent;
  }
  .source-tab:hover { color: var(--fg); }
  .source-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .source-pane { display: none; }
  .source-pane.active { display: block; }

  /* ── リーダー画面 ── */
  #readerScreen { background: var(--bg); position: relative; }

  .r-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); gap: 12px;
    flex-shrink: 0;
  }
  .icon-btn {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    width: 40px; height: 40px; border-radius: 8px;
    cursor: pointer; font-size: 18px; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--btn-hover); }
  #readerTitle {
    flex: 1; font-size: 13px; color: var(--sub);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center;
  }
  #readerInfo { font-size: 12px; color: var(--sub); flex-shrink: 0; min-width: 70px; text-align: right; }

  .word-stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 0;
  }
  #word {
    font-family: "Yu Mincho", "游明朝", "Hiragino Mincho ProN", serif;
    font-size: var(--word-size, 96px);
    font-weight: 500; line-height: 1.2; letter-spacing: 0.02em;
    text-align: center;
  }

  /* シークバー */
  .seek-wrap { padding: 6px 20px 0; flex-shrink: 0; }
  #seekBar {
    width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
    background: var(--progress-track); border-radius: 3px; outline: none;
    cursor: pointer;
  }
  #seekBar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }
  #seekBar::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
  }
  #seekBar::-moz-range-progress { background: var(--accent); height: 6px; border-radius: 3px; }

  .r-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; padding: 24px 20px 32px; flex-shrink: 0;
  }
  .nav-btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--back3-bg); border: 1px solid var(--border); color: var(--fg);
    font-size: 20px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--back3-hover); }
  .nav-btn:active { transform: scale(0.95); }
  .btn-back3 {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--back3-bg); border: 1px solid var(--border); color: var(--fg);
    font-size: 11px; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .btn-back3:hover { background: var(--back3-hover); }
  .btn-back3 .back3-icon { font-size: 18px; }
  .btn-play {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--accent); border: none; color: var(--bg);
    font-size: 28px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .btn-play:hover { filter: brightness(1.1); }

  #finishMsg {
    display: none; text-align: center; padding: 0 24px;
    font-size: 16px; color: var(--sub); line-height: 1.6;
  }

  /* クイック設定 */
  #quickPanelBackdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
  #quickPanelBackdrop.open { display: block; }
  #quickPanel {
    display: none; position: fixed; top: 0; right: 0; bottom: 0;
    width: 320px; max-width: 88vw;
    background: var(--card); border-left: 1px solid var(--border);
    z-index: 100; padding: 20px; overflow-y: auto;
    box-shadow: -8px 0 24px rgba(0,0,0,0.3);
  }
  #quickPanel.open { display: block; }
  .qp-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .qp-header h2 { font-size: 15px; font-weight: 500; color: var(--accent); }
  .qp-close {
    background: transparent; border: none; color: var(--sub);
    font-size: 26px; cursor: pointer; padding: 0; width: 36px; height: 36px; line-height: 1;
  }
  .qp-close:hover { color: var(--fg); }
  .qp-section { margin-bottom: 22px; }
  .qp-section .s-label { margin-bottom: 8px; }

  /* プログレスバー（取得中） */
  .progress-bar {
    width: 100%; height: 4px; background: var(--progress-track);
    border-radius: 2px; margin-top: 10px; overflow: hidden; display: none;
  }
  .progress-bar.active { display: block; }
  .progress-bar-fill {
    height: 100%; background: var(--accent); width: 0%;
    transition: width 0.15s ease;
  }
  .progress-bar.indeterminate .progress-bar-fill {
    width: 30% !important;
    animation: indeterminate 1.2s infinite ease-in-out;
  }
  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(380%); }
  }
</style>
</head>
<body>

<!-- ══ 設定画面 ══ -->
<div id="settingsScreen" class="screen active">
  <div class="s-header">
    <h1>青空フラッシュ暗読</h1>
  </div>

  <div class="s-section">
    <div class="s-label">テキストを選ぶ</div>
    <div class="s-card">
      <div class="source-tabs">
        <button type="button" class="source-tab active" data-source="preset">プリセット</button>
        <button type="button" class="source-tab" data-source="url">URL</button>
        <button type="button" class="source-tab" data-source="text">直接入力</button>
      </div>

      <div class="source-pane active" data-pane="preset">
        <select id="preset"></select>
      </div>
      <div class="source-pane" data-pane="url">
        <div class="url-row">
          <input type="text" id="urlInput" placeholder="青空文庫XHTMLページのURL">
          <button type="button" class="btn-sm" id="loadUrlBtn">取得</button>
        </div>
      </div>
      <div class="source-pane" data-pane="text">
        <textarea id="textInput" placeholder="ここに日本語の文章を貼り付け（小説、記事、何でもOK）"></textarea>
        <div style="margin-top:8px;">
          <button type="button" class="btn-sm" id="loadTextBtn">この文章で読み込む</button>
        </div>
      </div>

      <div class="progress-bar" id="loadProgress"><div class="progress-bar-fill" id="loadProgressFill"></div></div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">テーマ</div>
    <div class="s-card">
      <div class="pill-btns" id="themeBtns">
        <button type="button" class="pill-btn" data-theme="light">ライト</button>
        <button type="button" class="pill-btn" data-theme="sepia">セピア</button>
        <button type="button" class="pill-btn active" data-theme="dark">ダーク</button>
      </div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">表示設定</div>
    <div class="s-card">
      <div class="slider-row">
        <label>速度</label>
        <input type="range" id="speed" min="1" max="25" step="1" value="5">
        <span class="slider-val" id="speedVal">5 word/s</span>
      </div>
      <div class="slider-row">
        <label>文字サイズ</label>
        <input type="range" id="fontSize" min="32" max="240" step="4" value="96">
        <span class="slider-val" id="fontSizeVal">96px</span>
      </div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">表示単位</div>
    <div class="s-card">
      <div class="pill-btns" id="unitBtns">
        <button type="button" class="pill-btn active" data-unit="word">単語</button>
        <button type="button" class="pill-btn" data-unit="char">1文字</button>
        <button type="button" class="pill-btn" data-unit="phrase">文節</button>
      </div>
    </div>
  </div>

  <div id="settingsStatus"></div>
  <button type="button" class="start-btn" id="goReadBtn">読む ▶</button>
</div>

<!-- ══ リーダー画面 ══ -->
<div id="readerScreen" class="screen">
  <div class="r-topbar">
    <button type="button" class="icon-btn" id="backBtn" title="設定画面へ">←</button>
    <div id="readerTitle"></div>
    <div id="readerInfo"></div>
    <button type="button" class="icon-btn" id="menuBtn" title="クイック設定">☰</button>
  </div>

  <div class="word-stage">
    <div id="word">　</div>
    <div id="finishMsg">── 終了 ──<br><small>「3つ前」または▶で再読、← で設定画面</small></div>
  </div>

  <div class="seek-wrap">
    <input type="range" id="seekBar" min="0" max="100" value="0">
  </div>

  <div class="r-controls">
    <button type="button" class="nav-btn" id="prevBtn" title="1つ前 (←)">‹</button>
    <button type="button" class="btn-back3" id="back3Btn">
      <span class="back3-icon">↩</span>
      <span>3つ前</span>
    </button>
    <button type="button" class="btn-play" id="playBtn">▶</button>
    <button type="button" class="nav-btn" id="nextBtn" title="1つ次 (→)">›</button>
  </div>
</div>

<!-- ══ クイック設定パネル ══ -->
<div id="quickPanelBackdrop"></div>
<div id="quickPanel">
  <div class="qp-header">
    <h2>クイック設定</h2>
    <button type="button" class="qp-close" id="qpClose">×</button>
  </div>

  <div class="qp-section">
    <div class="s-label">速度</div>
    <div class="slider-row">
      <input type="range" id="qpSpeed" min="1" max="25" step="1" value="5">
      <span class="slider-val" id="qpSpeedVal">5 word/s</span>
    </div>
  </div>

  <div class="qp-section">
    <div class="s-label">文字サイズ</div>
    <div class="slider-row">
      <input type="range" id="qpFontSize" min="32" max="240" step="4" value="96">
      <span class="slider-val" id="qpFontSizeVal">96px</span>
    </div>
  </div>

  <div class="qp-section">
    <div class="s-label">表示単位（位置を保持）</div>
    <div class="pill-btns" id="qpUnitBtns">
      <button type="button" class="pill-btn active" data-unit="word">単語</button>
      <button type="button" class="pill-btn" data-unit="char">1文字</button>
      <button type="button" class="pill-btn" data-unit="phrase">文節</button>
    </div>
  </div>

  <div class="qp-section">
    <div class="s-label">テーマ</div>
    <div class="pill-btns" id="qpThemeBtns">
      <button type="button" class="pill-btn" data-theme="light">ライト</button>
      <button type="button" class="pill-btn" data-theme="sepia">セピア</button>
      <button type="button" class="pill-btn active" data-theme="dark">ダーク</button>
    </div>
  </div>
</div>

<script src="presets.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
