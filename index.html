<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青空フラッシュ暗読</title>
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #f0f0f0;
    --accent: #ffcc44;
    --sub: #888;
    --card: #252525;
    --border: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Yu Gothic UI", "游ゴシック UI", "Hiragino Kaku Gothic ProN", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  /* ── 画面切り替え ── */
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  /* ══════════════════════════════
     設定画面
  ══════════════════════════════ */
  #settingsScreen {
    padding: 0 0 40px;
    overflow-y: auto;
  }
  .s-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .s-header h1 { font-size: 18px; font-weight: 500; color: var(--accent); }
  .s-section { padding: 20px 24px 0; }
  .s-section + .s-section { padding-top: 24px; }
  .s-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--sub); margin-bottom: 10px;
  }
  .s-card {
    background: var(--card); border-radius: 8px; padding: 16px;
    border: 1px solid var(--border);
  }
  select, input[type="text"] {
    width: 100%; padding: 10px 12px;
    background: #1a1a1a; color: var(--fg);
    border: 1px solid #444; border-radius: 6px;
    font-size: 14px; font-family: inherit;
  }
  select { cursor: pointer; }
  .url-row { display: flex; gap: 8px; margin-top: 10px; }
  .url-row input { flex: 1; }
  .btn-sm {
    padding: 10px 14px; background: #333; color: var(--fg);
    border: 1px solid #555; border-radius: 6px;
    font-size: 13px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .btn-sm:hover { background: #444; }

  /* スライダー行 */
  .slider-row {
    display: flex; align-items: center; gap: 12px; margin-top: 0;
  }
  .slider-row + .slider-row { margin-top: 14px; }
  .slider-row label { font-size: 13px; color: var(--sub); min-width: 72px; }
  .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .slider-val {
    font-size: 14px; color: var(--accent); font-weight: 600;
    min-width: 52px; text-align: right;
  }

  /* 表示単位 */
  .unit-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .unit-btn {
    padding: 8px 16px; background: #1a1a1a; color: var(--sub);
    border: 1px solid var(--border); border-radius: 20px;
    font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .unit-btn.active {
    background: var(--accent); color: #222;
    border-color: var(--accent); font-weight: 600;
  }

  /* 読むボタン */
  .start-btn {
    display: block; margin: 28px 24px 0;
    padding: 16px; background: var(--accent); color: #222;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; text-align: center; width: calc(100% - 48px);
    transition: background 0.15s;
  }
  .start-btn:hover { background: #ffd866; }
  .start-btn:disabled { background: #555; color: #999; cursor: not-allowed; }

  #settingsStatus {
    font-size: 12px; color: var(--sub); padding: 10px 24px 0; min-height: 20px;
  }

  /* ══════════════════════════════
     表示画面（リーダー）
  ══════════════════════════════ */
  #readerScreen { background: var(--bg); }

  .r-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .back-btn {
    background: none; border: 1px solid var(--border); color: var(--sub);
    padding: 6px 14px; border-radius: 20px; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .back-btn:hover { border-color: var(--fg); color: var(--fg); }
  #readerTitle { font-size: 13px; color: var(--sub); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #readerInfo { font-size: 12px; color: var(--sub); }

  /* 単語表示エリア */
  .word-stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #word {
    font-family: "Yu Mincho", "游明朝", "Hiragino Mincho ProN", serif;
    font-size: var(--word-size, 96px);
    font-weight: 500; line-height: 1.2; letter-spacing: 0.02em;
    text-align: center;
  }

  /* プログレスバー */
  #progressWrap {
    height: 3px; background: #2a2a2a; margin: 0 20px;
  }
  #progressBar {
    height: 100%; width: 0; background: var(--accent);
    transition: width 0.15s linear; border-radius: 2px;
  }

  /* ボタンエリア */
  .r-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; padding: 28px 20px 36px;
  }
  .btn-back3 {
    width: 72px; height: 72px; border-radius: 50%;
    background: #2a2a2a; border: 1px solid var(--border); color: var(--fg);
    font-size: 11px; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; transition: background 0.15s;
    line-height: 1.3;
  }
  .btn-back3:hover { background: #383838; }
  .btn-back3 .back3-icon { font-size: 18px; }
  .btn-play {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--accent); border: none; color: #222;
    font-size: 28px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; box-shadow: 0 4px 20px rgba(255,204,68,0.3);
  }
  .btn-play:hover { background: #ffd866; }
  .btn-play.playing { font-size: 24px; }
  /* 終了表示 */
  #finishMsg {
    display: none; text-align: center; padding: 0 24px;
    font-size: 16px; color: var(--sub);
  }
</style>
</head>
<body>

<!-- ══ 設定画面 ══ -->
<div id="settingsScreen" class="screen active">
  <div class="s-header">
    <h1>青空フラッシュ暗読</h1>
  </div>

  <div class="s-section">
    <div class="s-label">テキストを選ぶ</div>
    <div class="s-card">
      <select id="preset">
        <option value="">── プリセットから選択 ──</option>
      </select>
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="または青空文庫のURLを入力">
        <button class="btn-sm" id="loadUrlBtn">取得</button>
      </div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">表示設定</div>
    <div class="s-card">
      <div class="slider-row">
        <label>速度</label>
        <input type="range" id="speed" min="40" max="1000" step="10" value="200">
        <span class="slider-val" id="speedVal">200ms</span>
      </div>
      <div class="slider-row">
        <label>文字サイズ</label>
        <input type="range" id="fontSize" min="32" max="200" step="4" value="96">
        <span class="slider-val" id="fontSizeVal">96px</span>
      </div>
    </div>
  </div>

  <div class="s-section">
    <div class="s-label">表示単位</div>
    <div class="s-card">
      <div class="unit-btns">
        <button class="unit-btn active" data-unit="word">単語</button>
        <button class="unit-btn" data-unit="char">1文字</button>
        <button class="unit-btn" data-unit="phrase">文節</button>
      </div>
    </div>
  </div>

  <div id="settingsStatus"></div>
  <button class="start-btn" id="goReadBtn" disabled>読む ▶</button>
</div>

<!-- ══ 表示画面（リーダー） ══ -->
<div id="readerScreen" class="screen">
  <div class="r-topbar">
    <button class="back-btn" id="backBtn">← 設定</button>
    <div id="readerTitle"></div>
    <div id="readerInfo"></div>
  </div>

  <div class="word-stage">
    <div id="word">　</div>
  </div>
  <div id="finishMsg">── 終了 ──<br><small>設定画面に戻って最初から読めます</small></div>

  <div id="progressWrap"><div id="progressBar"></div></div>

  <div class="r-controls">
    <button class="btn-back3" id="back3Btn">
      <span class="back3-icon">↩</span>
      <span>3つ前</span>
    </button>
    <button class="btn-play" id="playBtn">▶</button>
  </div>
</div>

<script src="presets.js"></script>
<script src="app.js"></script>
</body>
</html>
